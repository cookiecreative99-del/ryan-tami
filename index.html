<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Wedding Invitation</title>

    <meta property="og:title" content="Wedding Invitation">
    <meta property="og:description" content="Ryan & Tami">
    <meta property="og:image" content="https://ryan-tami.vercel.app/preview.jpg">
    <meta property="og:url" content="https://ryan-tami.vercel.app">
    <meta property="og:type" content="website">
    <meta property="og:image:width" content="1080">
    <meta property="og:image:height" content="1080">

    <meta name="twitter:card" content="summary_large_image">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Cinzel", serif;
        }

        body {
            width: 100%;
            min-height: 100vh;
            overflow: hidden;
            background: #a8a39d;
        }

        .cover {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100vh;
            padding: 40px 24px;
            background: url("background.jpg") center center / cover no-repeat;
            transition: opacity 1s ease;
        }

        .cover.fade-out {
            opacity: 0;
        }

        .overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.05);
        }

        .content {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 400px;
            text-align: center;
            color: #494c3b;
            transform: translateY(220px);
        }

        .label {
            color: #494c3b;
            margin-bottom: 14px;
            font-size: 15px;
            letter-spacing: 1px;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeUp 1s ease forwards;
            animation-delay: 0.2s;
        }

        .guest-name {
            margin-bottom: 30px;
            font-size: 38px;
            font-weight: 600;
            line-height: 1.3;
            word-break: break-word;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeUp 1s ease forwards;
            animation-delay: 0.6s;
        }

        .open-hint {
            margin-top: -10px;
            font-size: 12px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #4b4b4b;
            opacity: 0;
            transform: translateY(20px);
            animation:
                fadeUp 1s ease forwards,
                blink 2s ease-in-out infinite 2s;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes blink {
            0%,
            100% {
                opacity: 0.5;
            }

            50% {
                opacity: 1;
            }
        }

        #canvaContainer {
            display: none;
            width: 100%;
            min-height: 100vh;
        }

        #musicToggle {
            position: fixed;
            right: 20px;
            bottom: 20px;
            z-index: 9999;
            display: none;
            width: 52px;
            height: 52px;
            border: none;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.75);
            color: #fff;
            font-size: 20px;
            cursor: pointer;
        }

        @media (max-width: 480px) {
            .content {
                transform: translateY(200px);
            }

            .guest-name {
                font-size: 32px;
            }
        }
    </style>
</head>

<body>
    <audio id="bgMusic" loop>
        <source src="music.mp3" type="audio/mpeg">
    </audio>

    <button id="musicToggle">🔊</button>

    <section class="cover">
        <div class="overlay"></div>

        <div class="content">
            <div class="label">Dear,</div>

            <div class="guest-name" id="guestName">
                Nama Tamu
            </div>

            <div class="open-hint">
                (Klik amplop untuk membuka)
            </div>
        </div>
    </section>

    <div id="canvaContainer">
        <div
            style="
                position: relative;
                width: 100%;
                height: 0;
                padding-top: 1662.6647%;
                padding-bottom: 0;
                box-shadow: 0 2px 8px 0 rgba(63, 69, 81, 0.16);
                margin: 0;
                overflow: hidden;
                border-radius: 8px;
                will-change: transform;
            "
        >
            <iframe
                loading="lazy"
                src="https://www.canva.com/design/DAHLsjgfy5g/_XvFc47dDOXbCGnoa-utAw/view?embed"
                allowfullscreen="allowfullscreen"
                allow="fullscreen"
                style="
                    position: absolute;
                    top: 0;
                    left: 0;
                    width: 100%;
                    height: 100%;
                    margin: 0;
                    padding: 0;
                    border: none;
                "
            ></iframe>
        </div>
    </div>

    <script>
    const params = new URLSearchParams(window.location.search);
    const guest = params.get("to");

    if (guest) {
        document.getElementById("guestName").innerText =
            decodeURIComponent(guest);
    }

    const music = document.getElementById("bgMusic");
    const musicBtn = document.getElementById("musicToggle");
    const cover = document.querySelector(".cover");
    const canvaContainer = document.getElementById("canvaContainer");

    let invitationOpened = false;

    function autoScroll() {
        let autoScrolling = true;
        const speed = 1.2;

        function scrollStep() {
            if (!autoScrolling) return;

            window.scrollBy({
                top: speed,
                behavior: "auto"
            });

            requestAnimationFrame(scrollStep);
        }

        scrollStep();

        // berhenti setelah 12 detik
        setTimeout(() => {
            autoScrolling = false;
        }, 12000);

        // berhenti jika user scroll sendiri
        window.addEventListener(
            "wheel",
            () => {
                autoScrolling = false;
            },
            { once: true }
        );

        window.addEventListener(
            "touchmove",
            () => {
                autoScrolling = false;
            },
            { once: true }
        );
    }

    cover.addEventListener("click", function () {
        if (invitationOpened) return;

        invitationOpened = true;

        music.play().catch(function (err) {
            console.log(err);
        });

        cover.classList.add("fade-out");

        setTimeout(function () {
            cover.style.display = "none";
            canvaContainer.style.display = "block";
            musicBtn.style.display = "block";
            document.body.style.overflow = "auto";

            // tunggu Canva termuat lalu auto-scroll
            setTimeout(() => {
                autoScroll();
            }, 3000);

        }, 1000);
    });

    musicBtn.addEventListener("click", function () {
        if (music.paused) {
            music.play();
            musicBtn.innerHTML = "🔊";
        } else {
            music.pause();
            musicBtn.innerHTML = "🔇";
        }
    });
</script>
</body>
</html>
